# CI for SHANTAZ ERP — tests + production build must pass before merge.
#
# This workflow is intentionally minimal (install → test + build) because
# that is already enough to catch:
#   * 2b71bbc-class mass-deletion regressions (tests/regression.test.mjs)
#   * Pure-logic regressions in gst / itemImport / auth
#   * Build-time errors (missing imports, JSX syntax, broken paths)
#
# The job name is "ci" because the GitHub branch-protection "Required
# status checks" setting is keyed on job name (and scripts/ship.sh waits
# for a check named "ci"). Enabling branch protection on main → require
# "ci" to pass → merges and auto-deploys cannot proceed with a red build.
#
# Speed (same checks): node_modules is cached on the exact lockfile + Node
# version (no npm ci on a hit), and the unit tests and the production build
# run at the same time inside the one job (each still fails the job).
name: ci

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# One run per branch at a time — a new push to a feature branch cancels the
# superseded in-flight run. Runs on main are never cancelled: every merge
# commit gets its own complete run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        id: node
        uses: actions/setup-node@v4
        with:
          # Reads .nvmrc at repo root — must match the Vercel runtime.
          node-version-file: ".nvmrc"

      - name: Cache node_modules
        id: deps
        uses: actions/cache@v4
        with:
          path: node_modules
          # Exact key only (no restore-keys): a hit is byte-for-byte the tree
          # `npm ci` would produce for this lockfile on this Node version.
          key: nm-${{ runner.os }}-node${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        # `npm ci` is strict about package-lock.json integrity — exactly
        # what we want in CI (reproducible), as opposed to `npm install`.
        if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund

      - name: Run tests (unit + regression) and production build in parallel
        # tests/regression.test.mjs is the tripwire that would have blocked
        # the 2b71bbc mass-deletion. The build catches missing imports, JSX
        # syntax, and any transformation error Vite would hit on Vercel.
        # Env vars are intentionally unset — the build must succeed without
        # live Supabase creds (localStorage mode fallback). Both always run
        # to the end; either one failing fails the job.
        env:
          VITE_USE_SUPABASE: "false"
        run: |
          set +e   # the default shell is `bash -e`; collect both exit codes ourselves
          npm test > unit.log 2>&1 & t=$!
          npm run build > build.log 2>&1 & b=$!
          wait $t; trc=$?; wait $b; brc=$?
          echo "::group::npm test (exit $trc)"; cat unit.log; echo "::endgroup::"
          echo "::group::npm run build (exit $brc)"; cat build.log; echo "::endgroup::"
          [ $trc = 0 ] || echo "::error::npm test failed (exit $trc)"
          [ $brc = 0 ] || echo "::error::npm run build failed (exit $brc)"
          [ $trc = 0 ] && [ $brc = 0 ]

      - name: Bundle budget (health check on this build)
        # Main chunk / first-download size limits from scripts/health-check.mjs,
        # measured on the dist/ the step above just built.
        run: node scripts/health-check.mjs --only bundle --require-dist

  # ── Health guard: module-folder imports (resolve, no cycles, layer rules,
  # index.js-only cross-module imports), named-import ↔ export wiring, the
  # regression inventory, every Supabase table / RPC / bucket / Edge Function /
  # realtime table named in src exists in supabase/, env vars documented.
  # Pure node, no npm install, < 1 s. Bundle size is checked in "ci" after the build.
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
      - name: npm run health
        run: node scripts/health-check.mjs --only imports,wiring,db,env

  # ── Full browser e2e (every tests/e2e/*.mjs suite) against the local-mode
  # production build, split over 4 parallel runners (balanced by
  # tests/e2e/timings.txt). Runs on every push (feature branches + main);
  # the pull_request copy of this workflow skips it so it never runs twice.
  # Agents run only the suites related to their change locally
  # (scripts/ship.sh check); this is the full gate. The "e2e" job below is
  # the single check scripts/ship.sh waits for.
  e2e-shard:
    name: e2e shard ${{ matrix.shard }}/4
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      TZ: Asia/Calcutta          # same zone as the dev box the suites were written on
      E2E_PAR: "2"
      PW_VERSION: "1.63.0"       # same Playwright as the dev box
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        id: node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Cache node_modules
        id: deps
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-node${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ env.PW_VERSION }}

      - name: Install Playwright where the suites import it
        # The suites import /usr/local/lib/node_modules_global/playwright/index.js
        # (the dev box's global install); recreate that path here. One frozen
        # suite also saves a screenshot under /home/claude/work.
        run: |
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/pw" "playwright@$PW_VERSION" >/dev/null
          sudo mkdir -p /usr/local/lib/node_modules_global /home/claude/work
          sudo ln -sfn "$RUNNER_TEMP/pw/node_modules/playwright" /usr/local/lib/node_modules_global/playwright
          sudo chown -R "$USER" /home/claude
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium

      - name: Build (local mode, same as the e2e build on the dev box)
        env:
          VITE_USE_SUPABASE: "false"
        run: npx vite build --outDir "$RUNNER_TEMP/dist-e2e"

      - name: Run this shard's suites
        run: bash scripts/e2e-ci.sh ${{ matrix.shard }} 4 "$RUNNER_TEMP/dist-e2e"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-shard-${{ matrix.shard }}
          path: e2e-logs/
          retention-days: 7

  e2e:
    name: e2e
    if: always() && github.event_name == 'push'
    needs: e2e-shard
    runs-on: ubuntu-latest
    steps:
      - name: All e2e shards passed
        run: |
          echo "shards: ${{ needs.e2e-shard.result }}"
          [ "${{ needs.e2e-shard.result }}" = success ] || { echo "::error::e2e shards: ${{ needs.e2e-shard.result }}"; exit 1; }
