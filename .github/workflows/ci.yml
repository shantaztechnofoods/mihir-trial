# CI for SHANTAZ ERP — tests + production build must pass before merge.
#
# This workflow is intentionally minimal (install → test + build) because
# that is already enough to catch:
#   * 2b71bbc-class mass-deletion regressions (tests/regression.test.mjs)
#   * Pure-logic regressions in gst / itemImport / auth
#   * Build-time errors (missing imports, JSX syntax, broken paths)
#
# The job name is "ci" because the GitHub branch-protection "Required
# status checks" setting is keyed on job name (and scripts/ship.sh waits
# for a check named "ci"). Enabling branch protection on main → require
# "ci" to pass → merges and auto-deploys cannot proceed with a red build.
#
# Speed (same checks): node_modules is cached on the exact lockfile + Node
# version (no npm ci on a hit), and the unit tests and the production build
# run at the same time inside the one job (each still fails the job).
name: ci

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Least privilege for the GITHUB_TOKEN; jobs that need more ask for it (e2e-shard).
permissions:
  contents: read

# One run per workflow + ref at a time: a newer push cancels the superseded
# in-flight run (its result no longer matters; the newer commit gets a full run).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        id: node
        uses: actions/setup-node@v4
        with:
          # Reads .nvmrc at repo root — must match the Vercel runtime.
          node-version-file: ".nvmrc"

      - name: Cache node_modules
        id: deps
        uses: actions/cache@v4
        with:
          path: node_modules
          # Exact key only (no restore-keys): a hit is byte-for-byte the tree
          # `npm ci` would produce for this lockfile on this Node version.
          key: nm-${{ runner.os }}-node${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        # `npm ci` is strict about package-lock.json integrity — exactly
        # what we want in CI (reproducible), as opposed to `npm install`.
        if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund

      - name: Run tests (unit + regression) and production build in parallel
        # tests/regression.test.mjs is the tripwire that would have blocked
        # the 2b71bbc mass-deletion. The build catches missing imports, JSX
        # syntax, and any transformation error Vite would hit on Vercel.
        # Env vars are intentionally unset — the build must succeed without
        # live Supabase creds (localStorage mode fallback). Both always run
        # to the end; either one failing fails the job.
        env:
          VITE_USE_SUPABASE: "false"
        run: |
          set +e   # the default shell is `bash -e`; collect both exit codes ourselves
          npm test > unit.log 2>&1 & t=$!
          npm run build > build.log 2>&1 & b=$!
          wait $t; trc=$?; wait $b; brc=$?
          echo "::group::npm test (exit $trc)"; cat unit.log; echo "::endgroup::"
          echo "::group::npm run build (exit $brc)"; cat build.log; echo "::endgroup::"
          [ $trc = 0 ] || echo "::error::npm test failed (exit $trc)"
          [ $brc = 0 ] || echo "::error::npm run build failed (exit $brc)"
          [ $trc = 0 ] && [ $brc = 0 ]

      - name: Bundle budget (health check on this build)
        # Main chunk / first-download size limits from scripts/health-check.mjs,
        # measured on the dist/ the step above just built.
        run: node scripts/health-check.mjs --only bundle --require-dist

  # ── Health guard: module-folder imports (resolve, no cycles, layer rules,
  # index.js-only cross-module imports), named-import ↔ export wiring, the
  # regression inventory, every Supabase table / RPC / bucket / Edge Function /
  # realtime table named in src exists in supabase/, env vars documented.
  # Pure node, no npm install, < 1 s. Bundle size is checked in "ci" after the build.
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
      - name: npm run health
        run: node scripts/health-check.mjs --only imports,wiring,db,env

  # ── Browser e2e against the local-mode production build, split over parallel
  # runners (balanced by the CI-measured tests/e2e/timings.txt). Runs on every
  # push; the pull_request copy of this workflow skips it so it never runs twice.
  #   * FULL suite (every tests/e2e/*.mjs, 8 shards, gate check "e2e") on main,
  #     batch/**, modules/**, ci/**, any push whose head commit message holds
  #     "[full e2e]", and whenever the related suites are most of the suite time.
  #   * Other feature branches: only the suites scripts/e2e-pick.py relates to the
  #     branch's changes since main (1-8 shards, gate check "e2e (affected)").
  #     scripts/ship.sh merge still requires the FULL "e2e" check, so a feature
  #     PR reaches main through a batch/ PR (full run) or a "[full e2e]" push.
  # e2e-build builds the bundle ONCE; every shard downloads it instead of
  # rebuilding. Shards start at once and do their own setup (node_modules,
  # Playwright) while the build runs, then wait for the build job before
  # downloading it (fails fast if the build failed). ci and health run in
  # parallel with all of this (no needs).
  # The "e2e" job below is the single check scripts/ship.sh waits for.
  e2e-plan:
    name: e2e plan
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      suites: ${{ steps.plan.outputs.suites }}
      count: ${{ steps.plan.outputs.count }}
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - name: Full run? (main, batch/**, modules/**, ci/**, or "[full e2e]" in the commit message)
        id: full
        env:
          REF: ${{ github.ref_name }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          case "$REF" in main|batch/*|modules/*|ci/*) full=1 ;; *) full=0 ;; esac
          case "$MSG" in *"[full e2e]"*) full=1 ;; esac
          echo "full=$full" >>"$GITHUB_OUTPUT"; echo "branch $REF -> full=$full"

      - name: Checkout (with history, to diff against main)
        if: steps.full.outputs.full == '0'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Plan the suites
        id: plan
        env:
          FULL: ${{ steps.full.outputs.full }}
        run: |
          full(){ printf 'mode=full\nsuites=\ncount=all\nshards=[1,2,3,4,5,6,7,8]\n' | tee -a "$GITHUB_OUTPUT"; exit 0; }
          if [ "$FULL" = 1 ]; then full; fi
          base=$(git merge-base HEAD origin/main) || { echo "::warning::no merge-base with main: full run"; full; }
          # reasons (file -> suites) go to stderr, i.e. into this log
          # write outside the checkout: an untracked file in the repo would count as a change
          python3 scripts/e2e-pick.py --plan "$base" >"$RUNNER_TEMP/plan.txt"
          cat "$RUNNER_TEMP/plan.txt"; cat "$RUNNER_TEMP/plan.txt" >>"$GITHUB_OUTPUT"

  e2e-build:
    name: e2e build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        id: node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Cache node_modules
        id: deps
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-node${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund

      - name: Build (local mode, same as the e2e build on the dev box)
        env:
          VITE_USE_SUPABASE: "false"
        run: npx vite build --outDir dist-e2e

      - name: Upload the build for the shards
        uses: actions/upload-artifact@v4
        with:
          name: dist-e2e
          path: dist-e2e/
          retention-days: 1
          if-no-files-found: error

  e2e-shard:
    name: e2e shard ${{ matrix.shard }}/${{ strategy.job-total }}
    needs: e2e-plan
    if: github.event_name == 'push' && needs.e2e-plan.outputs.shards != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read              # wait for the "e2e build" job + download its artifact
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.e2e-plan.outputs.shards) }}
    env:
      TZ: Asia/Calcutta          # same zone as the dev box the suites were written on
      E2E_PAR: "2"
      PW_VERSION: "1.63.0"       # same Playwright as the dev box
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        id: node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Cache node_modules
        id: deps
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-node${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund

      - name: Cache Playwright (package + browsers)
        id: pw
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ${{ runner.temp }}/pw
          key: pw2-${{ runner.os }}-${{ env.PW_VERSION }}

      - name: Cache Playwright OS packages (.deb)
        # The Ubuntu package mirror is sometimes very slow (measured 6 Nov:
        # 14.6 MB took 12m47s on one shard, which made the whole run ~17 min
        # instead of ~4). Keep the downloaded .deb files so the next runs
        # install them from disk. Same packages, same install, no download.
        id: aptpw
        uses: actions/cache@v4
        with:
          path: ~/.apt-pw
          key: aptpw-${{ runner.os }}-${{ env.PW_VERSION }}

      - name: Install Playwright where the suites import it
        # The suites import /usr/local/lib/node_modules_global/playwright/index.js
        # (the dev box's global install); recreate that path here. One frozen
        # suite also saves a screenshot under /home/claude/work. On a cache hit
        # the package + browsers come from the cache; the OS libraries/fonts are
        # always installed (--with-deps) so rendering matches every run.
        run: |
          if [ "${{ steps.pw.outputs.cache-hit }}" != "true" ]; then
            npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/pw" "playwright@$PW_VERSION" >/dev/null
          fi
          sudo mkdir -p /usr/local/lib/node_modules_global /home/claude/work
          sudo ln -sfn "$RUNNER_TEMP/pw/node_modules/playwright" /usr/local/lib/node_modules_global/playwright
          sudo chown -R "$USER" /home/claude
          if ls "$HOME"/.apt-pw/*.deb >/dev/null 2>&1; then
            sudo cp -n "$HOME"/.apt-pw/*.deb /var/cache/apt/archives/ || true
          fi
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          if [ "${{ steps.aptpw.outputs.cache-hit }}" != "true" ] && ls /var/cache/apt/archives/*.deb >/dev/null 2>&1; then
            mkdir -p "$HOME/.apt-pw" && cp /var/cache/apt/archives/*.deb "$HOME/.apt-pw/"
            echo "kept $(ls "$HOME"/.apt-pw | wc -l) .deb files for the next runs"
          fi

      - name: Wait for the e2e build job
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 1 200); do
            st=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=50" \
                 --jq '.jobs[] | select(.name == "e2e build") | "\(.status) \(.conclusion)"' 2>/dev/null || true)
            case "$st" in
              "completed success") echo "e2e build done"; exit 0 ;;
              completed*) echo "::error::e2e build finished as: $st"; exit 1 ;;
            esac
            sleep 3
          done
          echo "::error::timed out waiting for the e2e build job"; exit 1

      - name: Download the e2e build
        uses: actions/download-artifact@v4
        with:
          name: dist-e2e
          path: ${{ runner.temp }}/dist-e2e

      - name: Run this shard's suites
        env:
          E2E_SUITES: ${{ needs.e2e-plan.outputs.suites }}   # empty on a full run = every suite
        run: bash scripts/e2e-ci.sh ${{ matrix.shard }} ${{ strategy.job-total }} "$RUNNER_TEMP/dist-e2e"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-shard-${{ matrix.shard }}
          path: e2e-logs/
          retention-days: 7

  e2e:
    # "e2e" = the FULL suite passed (what scripts/ship.sh merge requires);
    # "e2e (affected)" = only the suites related to this branch passed.
    name: ${{ needs.e2e-plan.outputs.mode == 'pick' && 'e2e (affected)' || 'e2e' }}
    if: always() && github.event_name == 'push'
    needs: [e2e-plan, e2e-build, e2e-shard]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All e2e shards passed
        # e2e-shard is a matrix: its result is success only when all its shards succeeded.
        env:
          PLAN: ${{ needs.e2e-plan.result }}
          MODE: ${{ needs.e2e-plan.outputs.mode }}
          SHARDS: ${{ needs.e2e-plan.outputs.shards }}
          SUITES: ${{ needs.e2e-plan.outputs.suites }}
          BUILD: ${{ needs.e2e-build.result }}
          SHARD_RESULT: ${{ needs.e2e-shard.result }}
        run: |
          echo "plan: $PLAN ($MODE, shards $SHARDS)  build: $BUILD  shards: $SHARD_RESULT"
          if [ "$MODE" = pick ]; then echo "affected suites: ${SUITES:-none}"; fi
          [ "$PLAN" = success ] || { echo "::error::e2e plan: $PLAN"; exit 1; }
          [ "$BUILD" = success ] || { echo "::error::e2e build: $BUILD"; exit 1; }
          if [ "$MODE" = pick ] && [ "$SHARDS" = "[]" ]; then echo "no browser suite is related to this change"; exit 0; fi
          [ "$SHARD_RESULT" = success ] || { echo "::error::e2e shards: $SHARD_RESULT"; exit 1; }
