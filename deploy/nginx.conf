# SHANTAZ ERP — nginx for the static Vite build (dist/). Used by deploy/Dockerfile;
# also works on any Linux server: copy dist/ to /usr/share/nginx/html and this file to
# /etc/nginx/conf.d/default.conf.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Hashed build files never change — cache for a year.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # index.html must always be fresh so a new deploy is picked up at once.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Optional: the WhatsApp relay functions (api/*.js) run in deploy/node-api/server.js.
  # Only needed when the WhatsApp module is ON. Uncomment and point at that server:
  # location /api/ { proxy_pass http://127.0.0.1:3001; proxy_set_header Host $host; client_max_body_size 30m; }

  # Single-page app: every other path is the React app.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
